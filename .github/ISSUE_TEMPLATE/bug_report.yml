name: Bug report
description: Something in T3 Code looks wrong or is hard to read with this theme.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Describe what you see and what you expected.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag a screenshot here. Include the window size if it only happens in small or large windows.
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Homebrew Channel
        - No Background
        - Pink
        - Red
        - Orange
        - Gold
        - Yellow
        - Green
        - Teal
        - Indigo
        - Purple
        - Magenta
        - Grey
    validations:
      required: true
  - type: input
    id: t3-version
    attributes:
      label: T3 Code version
      description: Shown in T3 Code's settings.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Web
    validations:
      required: true
